<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام جرد الأجهزة الاحترافي الفولاذي</title>
    <!-- مكتبة تصدير Excel فائقة الاستقرار -->
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --primary: #0f172a;
            --success: #16a34a;
            --info: #2563eb;
            --warning: #eab308;
            --bg: #f8fafc;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; text-align: center; color: #334155; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 22px; color: var(--primary); margin: 15px 0; font-weight: 800; }
        
        .preview-box { width: 100%; height: 260px; border-radius: 16px; background: #e2e8f0; margin-bottom: 20px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; border: 2px dashed #cbd5e1; overflow: hidden; }
        #output-image { width: 100%; height: 100%; object-fit: contain; display: none; }
        .placeholder-text { color: #64748b; font-size: 14px; font-weight: bold; }
        
        .camera-trigger-label { display: block; width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; color: white; background-color: var(--success); cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2); box-sizing: border-box; transition: transform 0.1s; text-align: center; }
        .camera-trigger-label:active { transform: scale(0.98); }
        #camera-file-input { display: none; }
        
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; color: white; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); -webkit-tap-highlight-color: transparent; }
        #export-btn { background-color: var(--info); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        #save-btn { background-color: var(--warning); color: #1e293b; margin-top: 15px; }
        button:active { opacity: 0.9; }
        
        .status { font-weight: 700; padding: 14px; background: #fff; border-radius: 12px; font-size: 14px; margin: 15px 0; border: 1px solid #e2e8f0; color: var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .result-card { background: white; padding: 22px; border-radius: 16px; text-align: right; box-shadow: 0 10px 25px rgba(0,0,0,0.04); margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .result-card h3 { margin-top: 0; border-bottom: 2px solid var(--bg); padding-bottom: 10px; color: var(--primary); font-size: 18px; }
        .result-card label { display: block; margin-top: 14px; font-weight: 700; font-size: 13px; color: #475569; }
        .result-card input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #f8fafc; }
        .key-badge { display: inline-block; padding: 6px 12px; font-size: 12px; font-weight: bold; background: var(--success); color: white; border-radius: 20px; margin-bottom: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام جرد الأجهزة الذكي الخارق قاهر المسافات ⚡</h1>
        
        <div class="key-badge" id="key-status" onclick="askForKey()">🔑 إعدادات المفتاح (اضغط للتعديل)</div>

        <div class="preview-box">
            <img id="output-image" alt="معاينة الصورة الملتقطة">
            <div id="placeholder" class="placeholder-text">اضغط على الزر الأخضر بالأسفل لتشغيل الكاميرا الرسمية المحسنة</div>
        </div>
        
        <div class="controls">
            <label for="camera-file-input" class="camera-trigger-label">📷 تشغيل الكاميرا والتقاط الداتا على أي بُعد</label>
            <input type="file" id="camera-file-input" accept="image/*" capture="environment">
            
            <button id="export-btn">📊 تحميل ملف Excel</button>
        </div>
        
        <div id="status" class="status">جاهز للجرد... التطبيق مجهز بمحرك معالجة رقمي خارق للمسافات والاهتزاز.</div>
        
        <div class="result-card">
            <h3>📋 البيانات المسحوبة تلقائياً:</h3>
            <label>نوع الجهاز:</label><input type="text" id="device-type" placeholder="حاسوب محمول، شاشة، طابعة...">
            <label>الشركة المصنعة:</label><input type="text" id="device-brand" placeholder="Dell, HP, Lenovo...">
            <label>الموديل (Model):</label><input type="text" id="device-model" placeholder="رقم الموديل">
            <label>الرقم التسلسلي (S/N):</label><input type="text" id="device-serial" placeholder="الرقم التسلسلي للجهاز">
            <button id="save-btn">💾 تأكيد وحفظ في القائمة</button>
        </div>
    </div>
    <script>
        let inventoryList = [];
        const fileInput = document.getElementById('camera-file-input');
        const outputImage = document.getElementById('output-image');
        const placeholder = document.getElementById('placeholder');
        const statusDiv = document.getElementById('status');
        const keyStatusObj = document.getElementById('key-status');

        function askForKey() {
            const currentKey = localStorage.getItem('gemini_key') || "";
            const userKey = prompt("الرجاء لصق مفتاح Gemini API الجديد الخاص بك هنا:", currentKey);
            if (userKey !== null && userKey.trim() !== "") {
                localStorage.setItem('gemini_key', userKey.trim());
                updateBadgeStatus(true);
                statusDiv.innerText = "تم حفظ المفتاح بنجاح! جاهز لالتقاط البيانات الخارقة.";
            } else if (!localStorage.getItem('gemini_key')) {
                updateBadgeStatus(false);
                statusDiv.innerText = "⚠️ تنبيه: يرجى إدخال المفتاح لتشغيل الذكاء الاصطناعي المطور.";
            }
        }

        function updateBadgeStatus(isActive) {
            if(isActive) {
                keyStatusObj.innerText = "✅ مفتاح الـ API محفوظ ونشط (اضغط للتعديل)";
                keyStatusObj.style.background = "#16a34a";
            } else {
                keyStatusObj.innerText = "❌ لم يتم إدخال مفتاح الـ API (اضغط هنا لإدخاله)";
                keyStatusObj.style.background = "#dc3545";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_key');
            if (savedKey && savedKey.trim() !== "") {
                updateBadgeStatus(true);
            } else {
                updateBadgeStatus(false);
                setTimeout(askForKey, 800);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const apiKey = localStorage.getItem('gemini_key');
            if (!apiKey) {
                alert("يرجى إدخال مفتاح الـ API أولاً!");
                askForKey();
                return;
            }

            const file = e.target.files[0];
            if (!file) return;

            statusDiv.innerText = "📸 جاري سحب اللقطة وتفعيل محرك التكبير والفلترة الرقمية...";
            
            const imageUrl = URL.createObjectURL(file);
            outputImage.src = imageUrl;
            outputImage.style.display = "block";
            placeholder.style.display = "none";

            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // ترقية المقاس برمجياً لـ 1600 بكسل لتضخيم الحروف الدقيقة والباركود البعيد جداً
                    const maxDim = 1600;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height && width > maxDim) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else if (height > maxDim) {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // دمج فلاتر معالجة عسكرية لرفع التباين والحدة (Contrast & Sharpness) لكسر عوائق الإضاءة والاهتزاز
                    ctx.filter = "contrast(1.4) saturate(1.1) brightness(1.05)";
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // حفظ اللقطة بأعلى مستويات النقاء والجودة الصافية لـ Gemini Pro
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.95);
                    const base64DataOnly = compressedBase64.substring(compressedBase64.indexOf(',') + 1);
                    
                    statusDiv.innerText = "🤖 محرك (Gemini 1.5 Pro) يفرز ويقشر البيانات من أي مسافة وبدقة خارقة...";
                    sendToGemini(base64DataOnly, apiKey);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        async function sendToGemini(base64Data, apiKey) {
            // الترقية الفورية للنموذج العملاق الخارق والأدق عالمياً لتفكيك الصور البعيدة والمغبشة (Gemini 1.5 Pro)
            const url = `https://googleapis.com{apiKey}`;
            
            const promptInstruction = "أنت محرك جرد عسكري فائق الذكاء. قم بمسح وتكبير هذه الصورة بدقة متناهية. الصورة تحتوي على ملصق مواصفات، أو كود QR، أو باركود مشفر لأجهزة من مسافة بعيدة أو مغبشة. قم بقراءة وفك كافة النصوص والرموز والأرقام التسلسلية المخفية والبعيدة مهما كانت معقدة. استخرج البيانات المهمة للجرد وأعد النتيجة بصيغة JSON نظيفة وصافية حصراً وبدون أي كلمات تمهيدية أو علامات مائلة: {\"type\": \"نوع الجهاز باللغة العربية بدقة كاملة مثل حاسوب محمول، شاشة، طابعة\" , \"brand\": \"اسم الشركة المصنعة بدقة مثل Dell, HP\", \"model\": \"رقم الموديل المستخرج بدقة وبأحرف كبيرة\", \"serial\": \"الرقم التسلسلي المسحوب S/N بدقة متناهية\"}. إذا لم يتوفر حقل اتركه فارغاً ولا تخترع بيانات.";

            const requestBody = {
                contents: [{
                    parts: [
                        { text: promptInstruction },
                        { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                    ]
                }]
            };

            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
                const data = await response.json();
                
                if (data.error) {
                    statusDiv.innerText = `خطأ تقني في المفتاح: ${data.error.message}`;
                    return;
                }

                let aiText = data.candidates[0].content.parts[0].text;
                
                aiText = aiText.replace(/```json/g, "").replace(/```/g, "").replace(/\\n/g, "").trim();
                
                const startIdx = aiText.indexOf('{');
                const endIdx = aiText.lastIndexOf('}');
                if (startIdx !== -1 && endIdx !== -1) {
                    aiText = aiText.substring(startIdx, endIdx + 1);
                }

                const deviceJSON = JSON.parse(aiText);

                document.getElementById('device-type').value = deviceJSON.type || '';
                document.getElementById('device-brand').value = deviceJSON.brand || '';
                document.getElementById('device-model').value = deviceJSON.model || '';
                document.getElementById('device-serial').value = deviceJSON.serial || '';
                
                statusDiv.innerText = "💥 تم قراءة وفك كافة البيانات بنجاح خارق وتعبئتها في الجدول!";
            } catch (e) {
                statusDiv.innerText = "فشلت المعالجة الرقمية. يرجى التأكد من أن الصورة تحتوي على ملصق أو باركود واضح وجرب مجدداً.";
                console.error(e);
            }
        }

        document.getElementById('save-btn').addEventListener('click', () => {
            inventoryList.push({
                "نوع الجهاز": document.getElementById('device-type').value,
                "الشركة المصنعة": document.getElementById('device-brand').value,
                "الموديل": document.getElementById('device-model').value,
                "الرقم التسلسلي": document.getElementById('device-serial').value,
                "تاريخ وقت الجرد": new Date().toLocaleString('ar-EG')
            });
            statusDiv.innerText = `تم حفظ الجهاز بنجاح! إجمالي القائمة الحالية: ${inventoryList.length}`;
            ['device-type', 'device-brand', 'device-model', 'device-serial'].forEach(id => document.getElementById(id).value = '');
            outputImage.style.display = "none";
            placeholder.style.display = "block";
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if(inventoryList.length === 0) return alert("لا توجد بيانات مسجلة لتصديرها!");
            const worksheet = XLSX.utils.json_to_sheet(inventoryList);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "الجرد الميداني الذكي");
            XLSX.writeFile(workbook, `جرد_الأجهزة_${new Date().toISOString().slice(0,10)}.xlsx`);
        });
    </script>
</body>
</html>
