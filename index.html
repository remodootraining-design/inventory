<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام جرد الأجهزة الذكي</title>
    <!-- مكتبة Excel خفيفة وسريعة جداً -->
    <script src="https://cloudflare.com" defer></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; }
        .camera-container { width: 100%; max-height: 280px; overflow: hidden; border-radius: 12px; background: #000; margin-bottom: 15px; }
        video { width: 100%; height: auto; display: block; }
        button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background: #28a745; color: white; cursor: pointer; margin-bottom: 10px; }
        button.secondary { background: #007bff; }
        button#save-btn { background: #ffc107; color: #212529; }
        .status { font-weight: bold; padding: 10px; background: #e9ecef; border-radius: 6px; font-size: 14px; margin: 15px 0; }
        .result-card { background: white; padding: 20px; border-radius: 12px; text-align: right; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .result-card label { display: block; margin-top: 12px; font-weight: bold; }
        .result-card input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام جرد الأجهزة الذكي</h1>
        <div class="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="snapshot" style="display:none;"></canvas>
        </div>
        <div class="controls">
            <button id="capture-btn">التقاط وتحليل الملصق</button>
            <button id="export-btn" class="secondary">تحميل ملف Excel</button>
        </div>
        <div id="status" class="status">جاهز للمسح...</div>
        <div class="result-card">
            <h3>البيانات المستخرجة:</h3>
            <label>نوع الجهاز:</label><input type="text" id="device-type">
            <label>الشركة المصنعة:</label><input type="text" id="device-brand">
            <label>الموديل (Model):</label><input type="text" id="device-model">
            <label>الرقم التسلسلي (S/N):</label><input type="text" id="device-serial">
            <button id="save-btn">تأكيد وحفظ في القائمة</button>
        </div>
    </div>
    <script>
        let inventoryList = [];
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('snapshot');
        const statusDiv = document.getElementById('status');

        // تشغيل الكاميرا الخلفية للجوال مباشرة عند فتح الرابط
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; statusDiv.innerText = "جاهز للمسح..."; })
            .catch(err => { statusDiv.innerText = "خطأ في تشغيل الكاميرا."; });

        document.getElementById('capture-btn').addEventListener('click', async () => {
            // تم إدراج مفتاح الـ API الخاص بك هنا بشكل صحيح تلقائياً
            const GEMINI_API_KEY = "AIzaSyAB0rNJpP5lJtQeo1lg9m7nSn4tRAtStq4dyJyjSXkPT4BS9Lrw"; 

            statusDiv.innerText = "جاري التقاط الصورة وتحليلها بالذكاء الاصطناعي...";
            try {
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // تحويل لقطة الكاميرا المباشرة إلى صيغة صالحة للإرسال لـ Gemini
                const base64Image = canvas.toDataURL('image/jpeg').split(',')[1];
                
                await analyzeImageWithGemini(base64Image, GEMINI_API_KEY);
            } catch (error) { 
                statusDiv.innerText = "خطأ في التقاط الصورة."; 
            }
        });

        async function analyzeImageWithGemini(base64Data, apiKey) {
            const url = `https://googleapis.com{apiKey}`;
            
            const requestBody = {
                contents: [{
                    parts: [
                        { text: "اقرأ هذا الملصق للجهاز بدقة واستخرج البيانات التالية بصيغة JSON حصراً وبدون أي كود إضافي أو نصوص تمهيدية: {\"type\": \"نوع الجهاز بالعربية مثل حاسوب محمول، شاشة، طابعة\" , \"brand\": \"اسم الشركة المصنعة مثل Dell, HP\", \"model\": \"رقم الموديل بدقة\", \"serial\": \"الرقم التسلسلي S/N بدقة\"}. إذا لم يتوفر حقل اتركه فارغاً." },
                        { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                    ]
                }]
            };

            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestBody) });
                const data = await response.json();
                let aiText = data.candidates[0].content.parts[0].text;
                
                // تنظيف الرد المستلم للتأكد من قراءته كـ JSON
                aiText = aiText.replace(/```json/g, "").replace(/```/g, "").trim();
                const deviceJSON = JSON.parse(aiText);
                
                document.getElementById('device-type').value = deviceJSON.type || '';
                document.getElementById('device-brand').value = deviceJSON.brand || '';
                document.getElementById('device-model').value = deviceJSON.model || '';
                document.getElementById('device-serial').value = deviceJSON.serial || '';
                statusDiv.innerText = "تم التحليل بنجاح!";
            } catch (e) { 
                statusDiv.innerText = "فشل تحليل الذكاء الاصطناعي، يرجى إعادة توجيه الكاميرا والمحاولة مجدداً."; 
                console.error(e);
            }
        }

        document.getElementById('save-btn').addEventListener('click', () => {
            inventoryList.push({
                "نوع الجهاز": document.getElementById('device-type').value,
                "الشركة المصنعة": document.getElementById('device-brand').value,
                "الموديل": document.getElementById('device-model').value,
                "الرقم التسلسلي": document.getElementById('device-serial').value
            });
            statusDiv.innerText = `تم الحفظ! الأجهزة المسجلة في القائمة الحالية: ${inventoryList.length}`;
            ['device-type', 'device-brand', 'device-model', 'device-serial'].forEach(id => document.getElementById(id).value = '');
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            if(inventoryList.length === 0) return alert("لا توجد بيانات لجردها!");
            const worksheet = XLSX.utils.json_to_sheet(inventoryList);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "الجرد");
            XLSX.writeFile(workbook, `جرد_الأجهزة.xlsx`);
        });
    </script>
</body>
</html>
