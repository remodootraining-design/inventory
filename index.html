<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام جرد الأجهزة الاحترافي التلقائي</title>
    
    <!-- استدعاء مكتبة المسح الضوئي الفوري ومكتبة الإكسل بأعلى استقرار -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        :root {
            --primary: #2c3e50;
            --success: #28a745;
            --info: #007bff;
            --warning: #ffc107;
            --bg: #f8fafc;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; text-align: center; color: #333; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { font-size: 20px; color: var(--primary); margin: 10px 0 20px 0; font-weight: 700; }
        
        /* مربع الكاميرا المباشر والمستقر */
        .camera-box { width: 100%; border-radius: 16px; background: #000; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border: 2px solid #fff; margin-bottom: 15px; position: relative; }
        #reader { width: 100%; background: black; }
        
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; color: white; cursor: pointer; margin-bottom: 10px; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); -webkit-tap-highlight-color: transparent; }
        #export-btn { background-color: var(--info); }
        #save-btn { background-color: var(--warning); color: #212529; margin-top: 15px; }
        button:active { opacity: 0.9; }
        
        .status { font-weight: 600; padding: 14px; background: #fff; border-radius: 12px; font-size: 14px; margin: 15px 0; border: 1px solid #e2e8f0; color: var(--primary); }
        .result-card { background: white; padding: 22px; border-radius: 16px; text-align: right; box-shadow: 0 10px 25px rgba(0,0,0,0.04); margin-bottom: 30px; border: 1px solid #e2e8f0; }
        .result-card h3 { margin-top: 0; border-bottom: 2px solid var(--bg); padding-bottom: 10px; color: var(--primary); font-size: 17px; }
        .result-card label { display: block; margin-top: 14px; font-weight: 700; font-size: 13px; color: #4a5568; }
        .result-card input { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #f8fafc; }
        .result-card input:focus { border-color: var(--info); background: #fff; outline: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>نظام جرد الأجهزة الذكي المباشر ⚡</h1>
        
        <!-- نافذة البث المباشر للكاميرا -->
        <div class="camera-box">
            <div id="reader"></div>
        </div>
        
        <div class="controls">
            <button id="export-btn">📊 تحميل تقرير Excel</button>
        </div>
        
        <div id="status" class="status">جاري تشغيل الكاميرا المباشرة... برجاء منح الصلاحية</div>
        
        <div class="result-card">
            <h3>📋 البيانات المسحوبة تلقائياً:</h3>
            <label>نوع الجهاز:</label><input type="text" id="device-type" placeholder="حاسوب محمول، شاشة، طابعة...">
            <label>الشركة المصنعة:</label><input type="text" id="device-brand" placeholder="Dell, HP, Lenovo...">
            <label>الموديل (Model):</label><input type="text" id="device-model" placeholder="رقم الموديل المستخرج">
            <label>الرقم التسلسلي (S/N):</label><input type="text" id="device-serial" placeholder="الرقم التسلسلي المسحوب">
            <button id="save-btn">💾 تأكيد وحفظ الجهاز في القائمة</button>
        </div>
    </div>
    <script>
        let inventoryList = [];
        let html5QrcodeScanner = null;
        
        const statusDiv = document.getElementById('status');

        // 1. تشغيل ماسح الكاميرا المباشر فور فتح الصفحة تلقائياً داخل الواجهة
        window.addEventListener('DOMContentLoaded', () => {
            startLiveScanner();
        });

        function startLiveScanner() {
            statusDiv.innerText = "جاري تشغيل الكاميرا المباشرة داخل الصفحة...";
            
            // إعداد محرك المسح الضوئي الفوري لقراءة الباركود بجميع أنواعه
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = { 
                fps: 20, 
                qrbox: function(width, height) {
                    // تحديد إطار قراءة مرن ومناسب لملصقات الأجهزة
                    return { width: Math.floor(width * 0.8), height: Math.floor(height * 0.5) };
                },
                aspectRatio: 1.333334
            };

            // تشغيل الكاميرا الخلفية مباشرة دون فتح أي تطبيق خارجي
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess, 
                onScanFailure
            )
            .then(() => {
                statusDiv.innerText = "⚡ الكاميرا المباشرة تعمل الآن! وجهها نحو باركود الجهاز أو الرقم التسلسلي وسيتم سحبه تلقائياً.";
            })
            .catch(err => {
                statusDiv.innerText = "تنبيه: يرجى فتح الرابط بمتصفح Chrome عادي (وليس علامة تبويب مخفية) للتأكد من تفعيل صلاحية الكاميرا المباشرة.";
                console.error(err);
            });
        }

        // 2. دالة النجاح: تُنفذ تلقائياً في نفس الجزء من الثانية عند رصد البيانات دون الحاجة لضغط أزرار
        function onScanSuccess(decodedText, decodedResult) {
            statusDiv.innerText = "✨ تم رصد وقراءة البيانات بنجاح!";
            
            // تنظيف النص المسحوب وتحويله لحروف كبيرة
            const cleanedText = decodedText.trim().toUpperCase();
            document.getElementById('device-serial').value = cleanedText;

            // تحليل وقراءة ذكية ونظيفة لتخمين الشركة والنوع بناءً على الرمز المسحوب
            let guessedBrand = "تلقائي";
            let guessedType = "جهاز إلكتروني";

            if (cleanedText.includes("DELL") || cleanedText.startsWith("CN0") || cleanedText.length === 7) {
                guessedBrand = "DELL";
                guessedType = "حاسوب محمول";
            } else if (cleanedText.includes("HP") || cleanedText.includes("CNB") || cleanedText.includes("CND")) {
                guessedBrand = "HP";
                guessedType = "حاسوب محمول/طابعة";
            } else if (cleanedText.includes("LENOVO") || cleanedText.startsWith("1S")) {
                guessedBrand = "LENOVO";
                guessedType = "حاسوب محمول";
            } else if (cleanedText.includes("APPL") || cleanedText.length === 12) {
                guessedBrand = "APPLE";
                guessedType = "حاسوب محمول/آيباد";
            }

            document.getElementById('device-brand').value = guessedBrand;
            document.getElementById('device-type').value = guessedType;
            
            // وضع الرمز كقيمة مبدئية للموديل ليقوم الموظف بمراجعته أو تعديله
            document.getElementById('device-model').value = "راجع الملصق";
            
            // إحداث اهتزاز خفيف في الجوال لإعلام الموظف بنجاح السحب
            if (navigator.vibrate) { navigator.vibrate(100); }
        }

        function onScanFailure(error) {
            // يتم تجاهل الأخطاء المستمرة أثناء البحث لضمان عدم توقف الكاميرا
        }

        // 3. حفظ البيانات في قائمة الجرد وتفريغ الخانات
        document.getElementById('save-btn').addEventListener('click', () => {
            const type = document.getElementById('device-type').value;
            const brand = document.getElementById('device-brand').value;
            const model = document.getElementById('device-model').value;
            const serial = document.getElementById('device-serial').value;

            if(!type && !brand && !model && !serial) {
                alert("برجاء تعبئة خانة واحدة على الأقل قبل الحفظ!");
                return;
            }

            inventoryList.push({
                "نوع الجهاز": type,
                "الشركة المصنعة": brand,
                "الموديل": model,
                "الرقم التسلسلي": serial,
                "تاريخ وقت الجرد": new Date().toLocaleString('ar-EG')
            });
            
            statusDiv.innerText = `✅ تم الحفظ بنجاح! إجمالي الأجهزة المسجلة حالياً: ${inventoryList.length}`;
            ['device-type', 'device-brand', 'device-model', 'device-serial'].forEach(id => document.getElementById(id).value = '');
        });

        // 4. تصدير قائمة الجرد كاملة إلى ملف Excel وتحميله فوراً على الهاتف
        document.getElementById('export-btn').addEventListener('click', () => {
            if(inventoryList.length === 0) {
                alert("لا توجد أجهزة مسجلة في القائمة حالياً لتصديرها!");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(inventoryList);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "تقرير الجرد");
            XLSX.writeFile(workbook, `جرد_الأجهزة_${new Date().toISOString().slice(0,10)}.xlsx`);
            statusDiv.innerText = "📊 تم تحميل ملف Excel بنجاح!";
        });
    </script>
</body>
</html>
